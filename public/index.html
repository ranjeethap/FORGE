<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FORGE MVP - Collaborative Platform</title>
    <style>
        body {
            background-color: #ff0000;
            color: #ffff00;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        h1 {
            font-size: 48px;
            margin-bottom: 20px;
            text-shadow: 3px 3px 0px #000;
        }
        p {
            font-size: 24px;
            margin-bottom: 10px;
        }
        .success-box {
            background-color: #00ff00;
            color: #000000;
            padding: 20px;
            border-radius: 10px;
            border: 5px solid #0000ff;
            margin-top: 20px;
        }
        .timestamp {
            font-size: 14px;
            margin-top: 30px;
            color: #ffffff;
        }
        .nav-links {
            margin-top: 30px;
        }
        .nav-links a {
            color: #ffff00;
            text-decoration: none;
            margin: 0 10px;
            padding: 10px 20px;
            border: 2px solid #ffff00;
            border-radius: 5px;
            background-color: rgba(255, 255, 0, 0.1);
        }
        .nav-links a:hover {
            background-color: rgba(255, 255, 0, 0.3);
        }
    </style>
</head>
<body>
    <h1>🚀 FORGE MVP IS WORKING! 🚀</h1>
    <p>This is our custom page content!</p>
    <p>If you see this bright red page with yellow text, our custom page is working!</p>
    <div class="success-box">
        <p style="margin: 0; font-size: 20px;">
            ✅ SUCCESS! Static HTML is being served! ✅
        </p>
    </div>
    <p class="timestamp">
        Timestamp: <span id="timestamp"></span>
    </p>
    
    <div class="nav-links">
        <a href="/forge">Go to /forge route</a>
        <a href="/test.html">Go to test.html</a>
    </div>
    
    <script>
        document.getElementById('timestamp').textContent = new Date().toLocaleString();
    </script>
</body>
</html>
