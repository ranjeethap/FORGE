<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FORGE MVP Test</title>
    <style>
        body {
            background-color: #ff0000;
            color: #ffff00;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        h1 {
            font-size: 48px;
            margin-bottom: 20px;
            text-shadow: 3px 3px 0px #000;
        }
        p {
            font-size: 24px;
            margin-bottom: 10px;
        }
        .success-box {
            background-color: #00ff00;
            color: #000000;
            padding: 20px;
            border-radius: 10px;
            border: 5px solid #0000ff;
            margin-top: 20px;
        }
        .timestamp {
            font-size: 14px;
            margin-top: 30px;
            color: #ffffff;
        }
    </style>
</head>
<body>
    <h1>🚀 FORGE MVP IS WORKING! 🚀</h1>
    <p>This is a static HTML test page!</p>
    <p>If you see this bright red page with yellow text, our server is working!</p>
    <div class="success-box">
        <p style="margin: 0; font-size: 20px;">
            ✅ SUCCESS! Static HTML is being served! ✅
        </p>
    </div>
    <p class="timestamp">
        Timestamp: <span id="timestamp"></span>
    </p>
    
    <script>
        document.getElementById('timestamp').textContent = new Date().toLocaleString();
    </script>
</body>
</html>
